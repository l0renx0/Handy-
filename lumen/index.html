<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumen</title>
<meta name="description" content="Ogni giorno qualcosa di vero, da fonti verificate.">
<meta name="theme-color" content="#ffffff" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,400..700&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  // Applica subito il tema salvato per evitare lampi di colore.
  try { if (localStorage.getItem("lumen:theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}
</script>
</head>
<body>
<div class="app">
  <header class="top" id="top">
    <div class="top-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1 class="brand-name">Lumen</h1>
          <p class="brand-date" id="today"></p>
        </div>
      </div>
      <div class="top-actions">
        <span class="streak" id="streak" title="Giorni di fila con almeno una lettura" hidden></span>
        <button class="icon-btn" id="theme-toggle" aria-label="Attiva modalità scura">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>

    <button class="update-banner" id="update-banner" hidden>
      <span class="pulse" aria-hidden="true"></span>Nuove notizie · <strong>Aggiorna</strong>
    </button>

    <nav class="sections" role="tablist" aria-label="Sezioni">
      <button role="tab" class="section-tab" data-section="novita" aria-selected="true">Novità</button>
      <button role="tab" class="section-tab" data-section="losapevi" aria-selected="false">Lo sapevi?</button>
      <span class="section-thumb" aria-hidden="true"></span>
    </nav>

    <div class="chips" id="chips" role="toolbar" aria-label="Filtra per argomento"></div>
  </header>

  <main class="feed" id="feed" aria-live="polite"></main>
</div>

<article class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
  <div class="detail-scroll" id="detail-scroll">
    <div class="detail-hero" id="detail-hero">
      <button class="icon-btn detail-close" id="detail-close" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>
</article>

<script src="app.js" type="module"></script>
</body>
</html>
