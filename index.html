<html lang="it">
<head>

<body>
<title>Handy+</title>
<meta name="apple-mobile-web-app-title" content="Handy+">
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen POS app. Views slide like iOS navigation (swipe from left edge = back). Dark matte, like the restaurant handheld. */
:root {
  --bg: #24262a;        /* grigio scuro opaco */
  --surface: #2d3034;
  --surface-2: #383b40;
  --surface-3: #43474d;
  --line: #4a4e55;
  --fg: #eef0f2;
  --muted: #9aa0a8;
  --free: #44484f;      /* tavolo libero */
  --busy: #d0403f;      /* tavolo occupato */
  --save: #2e9d5d;
  --new: #e3a83c;
  --shadow: rgba(0,0,0,.45);
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; background: var(--bg); }
body { height: 100%; position: relative; overflow: hidden;
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation;
  transition: transform .12s var(--ease), filter .12s, background-color .15s; }
button:active { transform: scale(.95); filter: brightness(1.18); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* VIEWS + navigazione */
.view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); z-index: 1; }
.view.enter { z-index: 2; animation: enter .32s var(--ease); box-shadow: -10px 0 30px var(--shadow); }
.view.leave { z-index: 2; animation: leave .26s var(--ease) forwards; box-shadow: -10px 0 30px var(--shadow); }
.view.under { z-index: 1; animation: under .26s var(--ease); }
.view.dragging { z-index: 2; box-shadow: -10px 0 30px var(--shadow); }
@keyframes enter { from { transform: translateX(100%); } }
@keyframes leave { to { transform: translateX(100%); } }
@keyframes under { from { transform: translateX(-28%); filter: brightness(.7); } }

.bar { display: flex; align-items: center; gap: 8px; min-height: 58px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--surface); flex: none; position: relative; z-index: 1; }
.bar h1 { font-family: var(--display); font-weight: 700; font-size: 26px; margin: 0; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .02em; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand .mark { width: 38px; height: 38px; flex: none; fill: none; stroke: none; }
.brand .mark * { stroke: none; }
.brand em { font-style: normal; color: var(--new); }
.bar h1 small { font-family: var(--body); font-weight: 500; font-size: 14px; color: var(--muted); margin-left: 7px; letter-spacing: 0; }
.btn { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: .05em; text-transform: uppercase;
  padding: 0 14px; height: 42px; border-radius: 10px; background: var(--surface-2); display: inline-flex; align-items: center; gap: 7px; flex: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.btn.save { background: var(--save); }
.btn.icon { width: 42px; padding: 0; justify-content: center; }
.btn.icon svg { width: 22px; height: 22px; }
.btn .count { background: rgba(0,0,0,.3); border-radius: 10px; padding: 0 7px; font-size: 15px; min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.btn .count.bump { animation: bump .3s var(--ease); }
@keyframes bump { 40% { transform: scale(1.35); background: var(--fg); color: var(--bg); } }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 96px; }
svg { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* SALA */
.summary { display: flex; gap: 8px; margin-bottom: 18px; }
.stat { flex: 1; background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.stat.hot b { color: var(--new); }
.area { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.area h2 { display: flex; justify-content: space-between; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0; }
.area h2 small { font-family: var(--body); letter-spacing: 0; text-transform: none; font-size: 13px; font-weight: 500; }
.tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
.tbl { aspect-ratio: 1; max-width: 100%; border-radius: 12px; background: var(--free); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-family: var(--display); font-weight: 700; font-size: 25px; line-height: 1; position: relative; font-variant-numeric: tabular-nums;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 2px 0 rgba(0,0,0,.25); }
.tbl.busy { background: var(--busy); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 2px 0 rgba(0,0,0,.3); }
.tbl .cov { font-family: var(--body); font-size: 11px; font-weight: 600; opacity: .9; }
.tbl .dot { position: absolute; top: 5px; right: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--new); box-shadow: 0 0 0 2px var(--busy); }
.tbl.extra:not(.busy) { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

/* ORDINE */
.courses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px)); background: var(--surface); flex: none; }
.courses button { height: 46px; border-radius: 10px; background: var(--surface-2); font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: .03em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 6px; }
.courses button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.courses button em { font-style: normal; font-family: var(--body); font-size: 12px; font-weight: 700; background: rgba(127,127,127,.3); border-radius: 8px; padding: 0 6px; }
.courses .drinkinfo { grid-column: 1 / -1; height: 46px; border-radius: 10px; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--muted); }
.courses .drinkinfo b { color: var(--fg); font-family: var(--display); font-size: 17px; letter-spacing: .05em; text-transform: uppercase; margin-right: 8px; }
.groups { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 12px max(12px, env(safe-area-inset-left, 0px)); background: var(--surface); flex: none; box-shadow: 0 6px 12px -8px var(--shadow); position: relative; z-index: 1; }
.groups::-webkit-scrollbar { display: none; }
.groups button { height: 36px; padding: 0 15px; border-radius: 18px; background: var(--surface-2); font-weight: 700; font-size: 13px; letter-spacing: .09em; flex: none; color: var(--muted); }
.groups button[aria-pressed="true"] { background: var(--surface-3); color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--muted); }
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cat { aspect-ratio: 1; max-width: 100%; border-radius: 12px; padding: 9px; display: flex; align-items: flex-end; text-align: left;
  background-color: var(--c); background-image: linear-gradient(155deg, rgba(255,255,255,.16), rgba(255,255,255,0) 45%, rgba(0,0,0,.22));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 3px 0 rgba(0,0,0,.28);
  font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.02; color: #fff; text-transform: uppercase; letter-spacing: .02em; position: relative;
  text-shadow: 0 1px 2px rgba(0,0,0,.35); overflow-wrap: anywhere; }
.cat .n { position: absolute; top: 8px; right: 8px; font-family: var(--body); font-size: 12px; font-weight: 700; background: var(--fg); color: var(--bg); border-radius: 10px; padding: 1px 7px; text-shadow: none; }
.cat .k { position: absolute; top: 9px; left: 10px; font-family: var(--body); font-size: 11px; font-weight: 600; opacity: .75; text-transform: none; letter-spacing: 0; }
.crumb { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.crumb .btn { height: 36px; font-size: 15px; padding: 0 12px 0 8px; gap: 2px; }
.crumb .btn svg { width: 18px; height: 18px; }
.crumb strong { font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center; gap: 8px; }
.crumb strong i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.item { min-height: 80px; border-radius: 12px; padding: 10px 11px 10px 14px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  background: var(--surface-2); position: relative; overflow: hidden; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
.item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.item.has { background: var(--surface-3); }
.item .nm { font-weight: 600; font-size: 15px; line-height: 1.2; padding-right: 26px; }
.item .pr { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.item .q { position: absolute; top: 8px; right: 8px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--fg); color: var(--bg);
  font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; padding: 0 6px; font-variant-numeric: tabular-nums; }
.item.flash::after { content: ""; position: absolute; inset: 0; background: var(--c); animation: flash .45s ease-out forwards; pointer-events: none; }
.item.flash .q { animation: bump .3s var(--ease); }
@keyframes flash { from { opacity: .55; } to { opacity: 0; } }

/* LISTA */
.lgroup { margin-bottom: 20px; }
.lgroup h3 { display: flex; justify-content: space-between; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px;
  padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.lgroup h3 small { font-family: var(--body); letter-spacing: 0; font-size: 13px; text-transform: none; }
.line { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: start; padding: 11px 6px; border-bottom: 1px solid var(--surface-2); border-radius: 8px;
  transition: background-color .2s, transform .2s var(--ease); }
.line.pressing { background: var(--surface-2); transform: scale(.98); }
.line .qty { font-family: var(--display); font-weight: 700; font-size: 25px; text-align: center; line-height: 1.05; font-variant-numeric: tabular-nums; }
.line .txt { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.line .txt b { font-weight: 600; font-size: 16px; }
.line .note { color: var(--new); font-style: italic; font-size: 14px; overflow-wrap: anywhere; }
.line .amt { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; padding-top: 3px; }
.chip { display: inline-block; font-family: var(--body); font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--bg); background: var(--new); border-radius: 4px; padding: 1px 5px; vertical-align: 2px; margin-left: 6px; }
.empty { color: var(--muted); text-align: center; padding: 48px 10px; line-height: 1.55; }
.empty svg { width: 40px; height: 40px; display: block; margin: 0 auto 12px; opacity: .6; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 6px 4px; font-family: var(--display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--muted); margin: 0 0 14px; display: flex; gap: 6px; align-items: center; }
.hint svg { width: 16px; height: 16px; flex: none; }

/* COMANDE SALVATE */
.card { background: var(--surface); border-radius: 14px; padding: 14px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
.card header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card header strong { font-family: var(--display); font-size: 28px; font-weight: 700; }
.card header span { color: var(--muted); font-size: 14px; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.card .warn { color: var(--new); font-size: 14px; }
.btn.danger { background: transparent; box-shadow: inset 0 0 0 1.5px var(--busy); color: #ff9e9e; }
.btn.danger.armed { background: var(--busy); color: #fff; }

/* SHEET */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; max-height: 90%; overflow-y: auto; animation: up .3s var(--ease); box-shadow: 0 -10px 40px var(--shadow); }
.sheet::before { content: ""; width: 38px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; flex: none; }
@keyframes up { from { transform: translateY(100%); } }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 26px; text-align: center; letter-spacing: .02em; }
.sheet .sub { margin: -10px 0 0; text-align: center; color: var(--muted); font-size: 14px; }
.sheet .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sheet .actions .btn { height: 52px; justify-content: center; }
.link { color: #ff9e9e; font-size: 14px; text-align: center; padding: 6px; }
.wheel { position: relative; height: 220px; overflow-y: scroll; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch;
  mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); scrollbar-width: none; }
.wheel::-webkit-scrollbar { display: none; }
.wheel-wrap { position: relative; }
.wheel-wrap::before { content: ""; position: absolute; left: 22%; right: 22%; top: 88px; height: 44px; border-radius: 10px; background: var(--surface-2); pointer-events: none; }
.wheel .pad { height: 88px; }
.wheel .wi { height: 44px; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; position: relative;
  font-family: var(--display); font-weight: 600; font-size: 24px; color: var(--muted); font-variant-numeric: tabular-nums; transition: color .1s, font-size .1s; }
.wheel .wi.sel { color: var(--fg); font-size: 31px; font-weight: 700; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { height: 42px; border-radius: 10px; background: var(--surface-2); font-weight: 600; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.stepper { display: flex; align-items: center; justify-content: center; gap: 24px; }
.stepper .btn { width: 56px; height: 56px; font-size: 30px; justify-content: center; padding: 0; border-radius: 50%; }
.stepper output { font-family: var(--display); font-size: 42px; font-weight: 700; min-width: 50px; text-align: center; font-variant-numeric: tabular-nums; }
textarea { width: 100%; box-sizing: border-box; min-height: 84px; resize: vertical; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
  color: var(--fg); font: 17px/1.4 var(--body); padding: 10px; -webkit-user-select: text; user-select: text; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { height: 34px; padding: 0 12px; border-radius: 17px; background: var(--surface-2); font-size: 14px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 15px; padding: 10px 16px 10px 12px; border-radius: 24px;
  max-width: calc(100% - 32px); white-space: nowrap; box-shadow: 0 8px 24px var(--shadow); animation: toast .25s var(--ease); }
.toast span { overflow: hidden; text-overflow: ellipsis; }
.toast i { width: 22px; height: 22px; border-radius: 50%; background: var(--save); color: #fff; display: grid; place-items: center; flex: none; }
.toast i svg { width: 14px; height: 14px; stroke-width: 3.2; }
@keyframes toast { from { transform: translate(-50%, 12px); opacity: 0; } }
.pane { flex: 1; position: relative; overflow: hidden; }
.pane > .scroll { position: absolute; inset: 0; background: var(--bg); z-index: 2; }
.pane > #o-under { z-index: 1; }
.pane .dragging { box-shadow: -10px 0 30px var(--shadow); }
.pane .enter { animation: enter .3s var(--ease); box-shadow: -10px 0 30px var(--shadow); }
.pane .under { animation: under .26s var(--ease); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<!-- SALA -->
<section class="view" id="v-sala">
  <div class="bar">
    <h1 class="brand"><svg class="mark" viewBox="60 20 420 420" aria-hidden="true"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#383b40"/><stop offset="1" stop-color="#1b1d20"/></linearGradient><linearGradient id="mtk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5544f"/><stop offset="1" stop-color="#b52f2e"/></linearGradient><linearGradient id="mpl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2c060"/><stop offset="1" stop-color="#d9962c"/></linearGradient></defs><g transform="rotate(-7 256 260)"><path d="M140 118 Q140 92 166 92 H346 Q372 92 372 118 V408 L360.4 390 L348.8 408 L337.2 390 L325.6 408 L314.0 390 L302.4 408 L290.8 390 L279.2 408 L267.6 390 L256.0 408 L244.4 390 L232.8 408 L221.2 390 L209.6 408 L198.0 390 L186.4 408 L174.8 390 L163.2 408 L151.6 390 L140.0 408 Z" fill="url(#mtk)"/><rect x="186" y="150" width="40" height="160" rx="6" fill="#fff"/><rect x="286" y="150" width="40" height="160" rx="6" fill="#fff"/><rect x="186" y="212" width="140" height="36" rx="4" fill="#fff"/><rect x="186" y="336" width="140" height="11" rx="5.5" fill="#fff" opacity=".55"/><rect x="186" y="358" width="96" height="11" rx="5.5" fill="#fff" opacity=".4"/></g><circle cx="380" cy="118" r="78" fill="var(--surface)"/><circle cx="380" cy="118" r="64" fill="url(#mpl)"/><rect x="369" y="80" width="22" height="76" rx="7" fill="var(--surface)"/><rect x="342" y="107" width="76" height="22" rx="7" fill="var(--surface)"/></svg><span>Handy<em>+</em></span></h1>
    <button class="btn" id="b-comande">Comande <span class="count" id="n-comande">0</span></button>
    <button class="btn icon" id="b-add" aria-label="Aggiungi tavolo"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="scroll">
    <div class="summary">
      <div class="stat"><b id="s-open">0</b><span>Tavoli aperti</span></div>
      <div class="stat"><b id="s-cov">0</b><span>Coperti</span></div>
      <div class="stat" id="s-new-box"><b id="s-new">0</b><span>Da salvare</span></div>
    </div>
    <div class="area"><h2>Dentro <small id="c-dentro"></small></h2><div class="tables" id="t-dentro"></div></div>
    <div class="area"><h2>Fuori <small id="c-fuori"></small></h2><div class="tables" id="t-fuori"></div></div>
    <div class="legend"><span><i style="background:var(--free)"></i>Libero</span><span><i style="background:var(--busy)"></i>Occupato</span><span><i style="background:var(--new);border-radius:50%"></i>Da salvare</span><span id="sync">Salvato su questo telefono</span><span>Versione 2.1</span></div>
  </div>
</section>

<!-- ORDINE -->
<section class="view" id="v-order" hidden>
  <div class="bar">
    <button class="btn icon" id="o-back" aria-label="Torna alla sala"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="o-title">T</h1>
    <button class="btn" id="o-list">Lista <span class="count" id="o-n">0</span></button>

  </div>

</section>

<div id="layer"></div>

<script src="menu.js?v=1792411145" charset="utf-8"></script>
<script>
const COURSES = [["ant", "Antipasti"], ["p1", "1ª portata"], ["p2", "2ª portata"]];
const DRINK_GROUPS = ["BAR", "VINI", "CAFFÈ", "VIP"];
const CAT_COLORS = {
  "Snacks": "#8a6d2f", "Sapore di mare": "#2e6f8e", "Caviar": "#3c3f58", "Festival di mare": "#23707a",
  "Antipasti": "#9a5b2c", "Pasta": "#b0832a", "Insalate": "#4e8a3c", "Secondi": "#2f5f9a", "Josper": "#a2452c",
  "Pizze": "#b3412f", "Dolci": "#a5527a",
  "Acqua e bibite": "#3a8fb7", "Signature": "#2f78a8", "Mocktails": "#5f8a3a", "Aperitivos": "#c0602c", "Clásicos": "#7a4fa0", "Sangría": "#a33b55", "Caffè": "#6b4a32", "Tè e infusi": "#5f7a4a",
  "Long drinks": "#456a8c", "Licores": "#8b5a2b", "Whisky": "#9a6a1f", "Cognac / Ron": "#7a3e24", "Gin": "#3f7f78", "Vodka / Tequila": "#5a5f9e",
  "Copa": "#8c3a4f", "Champagne": "#a88a3a", "Bianchi IT": "#9b9548", "Bianchi ES": "#86844a", "Bianchi mondo": "#6f7a45",
  "Rossi IT": "#7d2433", "Rossi ES": "#6a2a3e", "Rossi mondo": "#5c2a4a", "Rosati": "#b05a6e", "Sin alcohol": "#4d7a6a",
  "Bottiglie": "#4a4f5c", "Champagne VIP": "#9a7d2c", "Shows & packs": "#6d4a8c",
};
const EXTRA_CANDIDATES = [[51, 59, "dentro"], [60, 64, "dentro"], [65, 99, "dentro"], [100, 164, "fuori"], [165, 199, "fuori"], [200, 215, "fuori"]];
const KEY = "taccuino-comande-v1";
const ICON = {
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  hold: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>',
  plate: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>',
};

// ---------- stato ----------
let state = { extraTables: [], orders: {}, updatedAt: 0 };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.orders) state = s; } catch (e) {}
let ui = { table: null, course: "ant", group: "CUCINA", cat: null };
let remote = null, saveTimer = null;

function persist() {
  state.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  if (remote) { clearTimeout(saveTimer); saveTimer = setTimeout(() => remote.set({ json: JSON.stringify(state) }).catch(() => {}), 500); }
}
(async () => {
  try {
    const [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.collection("data/users/" + id).doc("state");
    const snap = await ref.get();
    const data = snap.exists ? snap.data() : null;
    if (data && data.json) {
      const s = JSON.parse(data.json);
      if (s.updatedAt > (state.updatedAt || 0)) { state = s; try { localStorage.setItem(KEY, data.json); } catch (e) {} rerender(); }
    }
    remote = ref;
    $("#sync").textContent = "Salvato nel tuo account";
    if (!data || state.updatedAt > JSON.parse(data.json || "{}").updatedAt) persist();
  } catch (e) {}
})();

// ---------- utilità ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const eur = n => n === undefined ? "" : n === null ? "s/m" : n.toLocaleString("it-IT", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) + " €";
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const uid = () => Math.random().toString(36).slice(2, 9);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let toastT;
function toast(msg, ok) {
  $(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = (ok ? `<i>${ICON.check}</i>` : "") + `<span>${esc(msg)}</span>`;
  document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 1700);
}
function bump(el) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

// ---------- vibrazione ----------
// iPhone (iOS 18+): attivare un interruttore "switch" di sistema produce un piccolo tic. Android: navigator.vibrate.
function haptic() {
  try {
    if (navigator.vibrate) { navigator.vibrate(10); return; }
    const label = document.createElement("label"); label.setAttribute("aria-hidden", "true"); label.style.display = "none";
    const input = document.createElement("input"); input.type = "checkbox"; input.setAttribute("switch", "");
    label.append(input); document.head.append(label); label.click(); label.remove();
  } catch (e) {}
}
document.addEventListener("click", e => { if (e.target.closest("button")) haptic(); }, true);

// ---------- navigazione (con swipe da sinistra) ----------
let current = "v-sala";
const VIEW_BACK = {
  "v-order": { to: "v-sala", prep: () => renderSala(), done: () => leaveTable() },
  "v-list": { to: "v-order", prep: () => renderOrder() },
  "v-comande": { to: "v-sala", prep: () => renderSala() },
};
function clean(v) { v.classList.remove("enter", "leave", "under", "dragging"); v.style.transform = ""; v.style.filter = ""; v.style.transition = ""; }
function show(id, back = false) {
  const from = $("#" + current), to = $("#" + id);
  if (from === to) return;
  document.querySelectorAll(".view").forEach(v => { if (v !== from && v !== to) { v.hidden = true; clean(v); } });
  clean(from); clean(to);
  to.hidden = false; current = id;
  if (reduced) { from.hidden = true; return; }
  let finished = false;
  const finish = () => { if (finished) return; finished = true; if (current !== from.id) { from.hidden = true; clean(from); } clean(to); };
  if (back) { from.classList.add("leave"); to.classList.add("under"); from.addEventListener("animationend", finish, { once: true }); }
  else { to.classList.add("enter"); to.addEventListener("animationend", finish, { once: true }); }
  setTimeout(finish, 450);
}
function slideIn(el, cls) {
  if (reduced) return;
  clean(el); void el.offsetWidth; el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 450);
}
// Un passo indietro: dentro il menu prima dai piatti alle categorie, poi da una schermata alla precedente.
function backStep() {
  if (current === "v-order" && ui.cat !== null) return {
    from: $("#o-body"), to: $("#o-under"),
    prep: () => { $("#o-under").innerHTML = catsHtml(); },
    done: () => { ui.cat = null; renderOrder(); $("#o-body").scrollTop = 0; },
  };
  const b = VIEW_BACK[current]; if (!b) return null;
  return { from: $("#" + current), to: $("#" + b.to), prep: b.prep, done: () => { b.done?.(); current = b.to; } };
}
function goBack() {
  if (current === "v-order" && ui.cat !== null) { ui.cat = null; renderOrder(); $("#o-body").scrollTop = 0; slideIn($("#o-body"), "under"); return; }
  const b = VIEW_BACK[current]; if (!b) return;
  b.prep?.(); b.done?.(); show(b.to, true);
}

let sw = null;
const EDGE = 32;
document.addEventListener("touchstart", e => {
  if ($("#layer").children.length || e.touches.length > 1 || !backStep()) return;
  const t = e.touches[0]; if (t.clientX > EDGE) return;
  sw = { x: t.clientX, y: t.clientY, lastX: t.clientX, lastT: performance.now(), v: 0, active: false };
}, { passive: true });
document.addEventListener("touchmove", e => {
  if (!sw) return;
  const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (!sw.active) {
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
    if (dx < 8) return;
    const st = backStep(); if (!st) { sw = null; return; }
    st.prep?.();
    Object.assign(sw, { active: true, step: st, from: st.from, to: st.to });
    st.to.hidden = false; st.from.classList.add("dragging");
  }
  e.preventDefault();
  const now = performance.now(); sw.v = (t.clientX - sw.lastX) / Math.max(1, now - sw.lastT); sw.lastX = t.clientX; sw.lastT = now;
  const W = sw.from.offsetWidth || innerWidth, x = Math.max(0, dx), p = Math.min(1, x / W);
  sw.x0 = x;
  sw.from.style.transform = `translateX(${x}px)`;
  sw.to.style.transform = `translateX(${-28 * (1 - p)}%)`;
  sw.to.style.filter = `brightness(${0.7 + 0.3 * p})`;
  const past = p > 0.4; if (past !== sw.past) { sw.past = past; if (past) haptic(); }
}, { passive: false });
function endSwipe() {
  if (!sw) return;
  const s = sw; sw = null; if (!s.active) return;
  const W = s.from.offsetWidth || innerWidth, x = s.x0 || 0;
  const commit = x > W * 0.4 || (s.v > 0.45 && x > 30);
  const tr = "transform .25s cubic-bezier(.2,.8,.2,1), filter .25s";
  s.from.style.transition = tr; s.to.style.transition = tr;
  requestAnimationFrame(() => {
    s.from.style.transform = commit ? `translateX(${W}px)` : "translateX(0)";
    s.to.style.transform = commit ? "translateX(0)" : "translateX(-28%)";
    s.to.style.filter = commit ? "brightness(1)" : "brightness(.7)";
  });
  setTimeout(() => {
    const isView = s.from.classList.contains("view");
    if (commit) { s.step.done(); if (isView) s.from.hidden = true; else s.to.hidden = true; }
    else s.to.hidden = true;
    clean(s.from); clean(s.to);
  }, 270);
}
document.addEventListener("touchend", endSwipe);
document.addEventListener("touchcancel", endSwipe);

// ---------- tavoli ----------
function allTables() {
  const base = [...range(1, 29).map(n => ({ n, area: "dentro" })), ...range(30, 50).map(n => ({ n, area: "fuori" }))];
  return [...base, ...state.extraTables.map(t => ({ ...t, extra: true }))].sort((a, b) => a.n - b.n);
}
const order = n => state.orders[n];
const lines = n => order(n)?.lines || [];
const unsaved = n => lines(n).some(l => !l.saved);
const isBusy = n => lines(n).length > 0;

// ---------- SALA ----------
function renderSala() {
  const tabs = allTables();
  for (const area of ["dentro", "fuori"]) {
    const list = tabs.filter(t => t.area === area);
    $("#t-" + area).innerHTML = list.map(t => {
      const o = order(t.n), busy = isBusy(t.n);
      return `<button class="tbl ${busy ? "busy" : ""} ${t.extra ? "extra" : ""}" data-t="${t.n}" aria-label="Tavolo ${t.n}${busy ? ", occupato" : ""}">
        ${t.n}${busy ? `<span class="cov">${o.covers} cop.</span>` : ""}${busy && unsaved(t.n) ? '<span class="dot"></span>' : ""}</button>`;
    }).join("");
    $("#c-" + area).textContent = `${list.filter(t => isBusy(t.n)).length} / ${list.length} occupati`;
  }
  const open = Object.keys(state.orders).filter(n => isBusy(n));
  $("#n-comande").textContent = open.length;
  $("#s-open").textContent = open.length;
  $("#s-cov").textContent = open.reduce((s, n) => s + order(n).covers, 0);
  const pend = open.filter(n => unsaved(n)).length;
  $("#s-new").textContent = pend; $("#s-new-box").classList.toggle("hot", pend > 0);
}
document.addEventListener("click", e => {
  const b = e.target.closest(".tbl"); if (!b) return;
  const n = +b.dataset.t;
  if (isBusy(n)) openOrder(n); else askCovers(n);
});
$("#b-add").onclick = askNewTable;
$("#b-comande").onclick = () => { renderComande(); show("v-comande"); };

// ---------- sheet + ruota ----------
function sheet(html) {
  $("#layer").innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  $("#layer .scrim").onclick = closeSheet;
  return $("#layer .sheet");
}
function closeSheet() { $("#layer").innerHTML = ""; }
function wheel(el, values, initial) {
  const H = 44;
  el.innerHTML = `<div class="pad"></div>${values.map(v => `<div class="wi">${v}</div>`).join("")}<div class="pad"></div>`;
  const items = [...el.querySelectorAll(".wi")];
  const idx = () => Math.max(0, Math.min(values.length - 1, Math.round(el.scrollTop / H)));
  let last = -1;
  const mark = () => { const i = idx(); if (i === last) return; last = i; items.forEach((it, j) => it.classList.toggle("sel", i === j)); };
  el.addEventListener("scroll", mark, { passive: true });
  items.forEach((it, j) => it.onclick = () => { haptic(); el.scrollTo({ top: j * H, behavior: "smooth" }); });
  requestAnimationFrame(() => { el.scrollTop = Math.max(0, values.indexOf(initial)) * H; mark(); });
  return () => values[idx()];
}

function askCovers(n) {
  const t = allTables().find(x => x.n === n);
  sheet(`<h2>Tavolo ${n}</h2><p class="sub">Quanti coperti?</p>
    <div class="wheel-wrap"><div class="wheel" id="w-cov"></div></div>
    <div class="actions"><button class="btn" id="s-no">Annulla</button><button class="btn save" id="s-ok">Apri tavolo</button></div>
    ${t?.extra ? '<button class="link" id="s-del">Rimuovi tavolo dalla sala</button>' : ""}`);
  const get = wheel($("#w-cov"), range(1, 30), 2);
  $("#s-no").onclick = closeSheet;
  $("#s-ok").onclick = () => { state.orders[n] = { covers: get(), lines: [], savedAt: null }; closeSheet(); openOrder(n); };
  if (t?.extra) $("#s-del").onclick = () => { state.extraTables = state.extraTables.filter(x => x.n !== n); delete state.orders[n]; persist(); closeSheet(); renderSala(); toast(`Tavolo ${n} rimosso`, true); };
}
function askNewTable() {
  const used = new Set(allTables().map(t => t.n));
  const cand = EXTRA_CANDIDATES.flatMap(([a, b, area]) => range(a, b).filter(n => !used.has(n)).map(n => ({ n, area })));
  if (!cand.length) return toast("Nessun tavolo da aggiungere");
  sheet(`<h2>Aggiungi tavolo</h2><p class="sub" id="s-area"></p>
    <div class="wheel-wrap"><div class="wheel" id="w-tab"></div></div>
    <div class="actions"><button class="btn" id="s-no">Annulla</button><button class="btn save" id="s-ok">Aggiungi</button></div>`);
  const nums = cand.map(c => c.n);
  const get = wheel($("#w-tab"), nums, nums.find(n => n >= 60) ?? nums[0]);
  const area = () => cand.find(c => c.n === get()).area;
  const upd = () => $("#s-area").textContent = area() === "dentro" ? "Va in: Dentro" : "Va in: Fuori";
  $("#w-tab").addEventListener("scroll", upd, { passive: true }); requestAnimationFrame(upd);
  $("#s-no").onclick = closeSheet;
  $("#s-ok").onclick = () => { const n = get(); state.extraTables.push({ n, area: area() }); persist(); closeSheet(); renderSala(); toast(`Tavolo ${n} aggiunto`, true); };
}

// ---------- ORDINE ----------
function openOrder(n) {
  ui.table = n; ui.cat = null;
  $("#o-title").innerHTML = `T ${n}<small>${order(n).covers} cop.</small>`;
  renderOrder(); show("v-order");
}
function catsHtml() {
  const ls = lines(ui.table), g = MENU.find(x => x.group === ui.group);
  const qtyOf = name => ls.filter(l => l.name === name).reduce((s, l) => s + l.qty, 0);
  return `<div class="cats">${g.categories.map((c, i) => {
    const n = c.items.reduce((s, it) => s + qtyOf(it[0]), 0);
    return `<button class="cat" style="--c:${CAT_COLORS[c.name] || "#555"}" data-cat="${i}">${esc(c.name)}${n ? `<span class="n">${n}</span>` : ""}</button>`;
  }).join("")}</div>`;
}
function renderOrder() {
  const drinks = DRINK_GROUPS.includes(ui.group);
  const ls = lines(ui.table);
  const inCourse = k => ls.filter(l => l.course === k).reduce((s, l) => s + l.qty, 0);
  $("#courses").innerHTML = drinks
    ? `<div class="drinkinfo"><b>Bevande</b>vanno in una sezione a parte</div>`
    : COURSES.map(([k, l]) => { const c = inCourse(k); return `<button aria-pressed="${ui.course === k}" data-c="${k}">${l}${c ? `<em>${c}</em>` : ""}</button>`; }).join("");
  $("#groups").innerHTML = MENU.map(g => `<button aria-pressed="${ui.group === g.group}" data-g="${g.group}">${g.group}</button>`).join("");
  const g = MENU.find(x => x.group === ui.group);
  const qtyOf = name => ls.filter(l => l.name === name).reduce((s, l) => s + l.qty, 0);
  if (ui.cat === null) {
    $("#o-body").innerHTML = catsHtml();
  } else {
    const c = g.categories[ui.cat], col = CAT_COLORS[c.name] || "#555";
    $("#o-body").innerHTML = `<div class="crumb" style="--c:${col}"><button class="btn" id="b-cats">${ICON.back}Categorie</button><strong><i></i>${esc(c.name)}</strong></div>
      <div class="items">${c.items.map((it, i) => {
        const q = qtyOf(it[0]);
        return `<button class="item ${q ? "has" : ""}" style="--c:${col}" data-i="${i}"><span class="nm">${esc(it[0])}</span>
          <span class="pr">${[eur(it[1]), it[2] && esc(it[2])].filter(Boolean).join(" · ") || "&nbsp;"}</span>${q ? `<span class="q">${q}</span>` : ""}</button>`;
      }).join("")}</div>`;
  }
  $("#o-n").textContent = ls.reduce((s, l) => s + l.qty, 0);
}
$("#courses").onclick = e => { const b = e.target.closest("[data-c]"); if (b) { ui.course = b.dataset.c; renderOrder(); } };
$("#groups").onclick = e => { const b = e.target.closest("[data-g]"); if (b) { ui.group = b.dataset.g; ui.cat = null; renderOrder(); $("#o-body").scrollTop = 0; } };
$("#o-body").onclick = e => {
  if (e.target.closest("#b-cats")) return goBack();
  const c = e.target.closest("[data-cat]"); if (c) { ui.cat = +c.dataset.cat; renderOrder(); $("#o-body").scrollTop = 0; slideIn($("#o-body"), "enter"); return; }
  const it = e.target.closest("[data-i]"); if (!it) return;
  const cat = MENU.find(x => x.group === ui.group).categories[ui.cat];
  const [name, price, info] = cat.items[+it.dataset.i];
  const course = DRINK_GROUPS.includes(ui.group) ? "bev" : ui.course;
  const ls = order(ui.table).lines;
  const same = ls.find(l => !l.saved && !l.note && l.name === name && l.course === course);
  if (same) same.qty++; else ls.push({ id: uid(), name, price, info: info || "", course, qty: 1, note: "", saved: false });
  persist(); renderOrder();
  $(`#o-body [data-i="${it.dataset.i}"]`).classList.add("flash");
  bump($("#o-n"));
  toast(`+1 ${name}${course === "bev" ? "" : " · " + COURSES.find(c => c[0] === course)[1]}`);
};
$("#o-back").onclick = $("#l-back").onclick = $("#c-back").onclick = goBack;
$("#o-list").onclick = () => { renderList(); show("v-list"); };
$("#o-save").onclick = $("#l-save").onclick = saveOrder;
function leaveTable() { const o = order(ui.table); if (o && !o.lines.length) delete state.orders[ui.table]; persist(); renderSala(); }
function saveOrder() {
  const o = order(ui.table);
  if (!o.lines.length) return toast("Aggiungi almeno un piatto");
  o.lines.forEach(l => l.saved = true); o.savedAt = Date.now();
  persist(); renderSala(); show("v-sala", true); toast(`Comanda tavolo ${ui.table} salvata`, true);
}

// ---------- LISTA ----------
const SECTIONS = [...COURSES, ["bev", "Bevande"]];
function linesHtml(n, editable) {
  const ls = lines(n);
  if (!ls.length) return `<p class="empty">${ICON.plate}Ancora niente in questa comanda.<br>Torna al menu e tocca un piatto per aggiungerlo.</p>`;
  let total = 0;
  const html = SECTIONS.map(([k, label]) => {
    const g = ls.filter(l => l.course === k); if (!g.length) return "";
    return `<div class="lgroup"><h3>${label}<small>${g.reduce((s, l) => s + l.qty, 0)} pz.</small></h3>${g.map(l => {
      if (l.price) total += l.price * l.qty;
      return `<div class="line" ${editable ? `data-l="${l.id}"` : ""}><span class="qty">${l.qty}</span>
        <span class="txt"><b>${esc(l.name)}${!l.saved ? '<span class="chip">NUOVO</span>' : ""}</b>${l.note ? `<span class="note">${esc(l.note)}</span>` : ""}</span>
        <span class="amt">${l.price == null ? eur(l.price) : eur(l.price * l.qty)}</span></div>`;
    }).join("")}</div>`;
  }).join("");
  return html + `<div class="total"><span>Totale</span><span>${eur(total)}</span></div>`;
}
function renderList() {
  const n = ui.table;
  $("#l-title").innerHTML = `T ${n}<small>${order(n).covers} cop.</small>`;
  $("#l-body").innerHTML = (lines(n).length ? `<p class="hint">${ICON.hold}Tieni premuto una riga per varianti e quantità.</p>` : "") + linesHtml(n, true);
}

// pressione lunga sulle righe
let lp = null;
$("#l-body").addEventListener("pointerdown", e => {
  const row = e.target.closest("[data-l]"); if (!row) return;
  row.classList.add("pressing");
  lp = { row, x: e.clientX, y: e.clientY, t: setTimeout(() => { row.classList.remove("pressing"); lp = null; haptic(); editLine(row.dataset.l); }, 450) };
});
const cancelLp = e => { if (!lp) return; if (e.type === "pointermove" && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) < 10) return;
  clearTimeout(lp.t); lp.row.classList.remove("pressing"); lp = null; };
["pointerup", "pointercancel", "pointermove", "pointerleave"].forEach(ev => $("#l-body").addEventListener(ev, cancelLp));
$("#l-body").addEventListener("contextmenu", e => e.preventDefault());

function editLine(id) {
  const o = order(ui.table), l = o.lines.find(x => x.id === id); if (!l) return;
  let qty = l.qty, course = l.course;
  const quick = ["Senza glutine", "Senza lattosio", "Allergia frutta secca", "Al sangue", "Media cottura", "Ben cotta", "Senza cipolla", "Da dividere"];
  sheet(`<h2>${esc(l.name)}</h2>
    <div class="stepper"><button class="btn" id="e-m" aria-label="Meno">−</button><output id="e-q">${qty}</output><button class="btn" id="e-p" aria-label="Più">+</button></div>
    ${course !== "bev" ? `<div class="seg" id="e-c">${COURSES.map(([k, lb]) => `<button aria-pressed="${k === course}" data-c="${k}">${lb}</button>`).join("")}</div>` : ""}
    <label for="e-note" class="hint" style="margin:0">Variante</label>
    <textarea id="e-note" placeholder="Es. senza cipolla, cottura media…">${esc(l.note)}</textarea>
    <div class="quick">${quick.map(q => `<button data-q="${q}">${q}</button>`).join("")}</div>
    <div class="actions"><button class="btn danger" id="e-del">Elimina</button><button class="btn save" id="e-ok">Fatto</button></div>`);
  $("#e-m").onclick = () => { qty = Math.max(1, qty - 1); $("#e-q").textContent = qty; };
  $("#e-p").onclick = () => { qty++; $("#e-q").textContent = qty; };
  if ($("#e-c")) $("#e-c").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; course = b.dataset.c;
    $("#e-c").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
  document.querySelector(".quick").onclick = e => { const b = e.target.closest("[data-q]"); if (!b) return;
    const ta = $("#e-note"); ta.value = ta.value.trim() ? ta.value.trim() + ", " + b.dataset.q.toLowerCase() : b.dataset.q; };
  let armed = false;
  $("#e-del").onclick = e => { if (!armed) { armed = true; e.currentTarget.classList.add("armed"); e.currentTarget.textContent = "Conferma"; return; }
    o.lines = o.lines.filter(x => x.id !== id); persist(); closeSheet(); renderList(); toast(`${l.name} eliminato`); };
  $("#e-ok").onclick = () => {
    const note = $("#e-note").value.trim();
    if (qty !== l.qty || course !== l.course || note !== l.note) { l.qty = qty; l.course = course; l.note = note; l.saved = false; }
    persist(); closeSheet(); renderList();
  };
}

// ---------- COMANDE ----------
function renderComande() {
  const ns = Object.keys(state.orders).map(Number).filter(isBusy).sort((a, b) => a - b);
  if (!ns.length) { $("#c-body").innerHTML = `<p class="empty">${ICON.plate}Nessuna comanda aperta.<br>Tocca un tavolo in sala per iniziarne una.</p>`; return; }
  $("#c-body").innerHTML = ns.map(n => {
    const o = order(n), t = allTables().find(x => x.n === n);
    const time = o.savedAt ? new Date(o.savedAt).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }) : null;
    return `<article class="card"><header><strong>T ${n}</strong><span>${t ? (t.area === "dentro" ? "Dentro" : "Fuori") : ""} · ${o.covers} coperti${time ? " · salvata " + time : ""}</span></header>
      ${unsaved(n) ? '<span class="warn">Ci sono righe non ancora salvate.</span>' : ""}
      ${linesHtml(n, false)}
      <div class="row"><button class="btn" data-open="${n}">Apri</button><button class="btn danger" data-free="${n}">Libera tavolo</button></div></article>`;
  }).join("");
}
$("#c-body").onclick = e => {
  const op = e.target.closest("[data-open]"); if (op) return openOrder(+op.dataset.open);
  const fr = e.target.closest("[data-free]"); if (!fr) return;
  if (!fr.classList.contains("armed")) { fr.classList.add("armed"); fr.textContent = "Conferma: libera"; return; }
  const n = +fr.dataset.free; delete state.orders[n]; persist(); renderSala(); renderComande(); toast(`Tavolo ${n} liberato`, true);
};

function rerender() {
  renderSala();
  if (current === "v-order" && ui.table && order(ui.table)) renderOrder();
  else if (current === "v-list" && ui.table && order(ui.table)) renderList();
  else if (current === "v-comande") renderComande();
  else show("v-sala", true);
}
renderSala();
</script>
